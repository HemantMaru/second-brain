<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        background: #020204;
        color: #d1d5db;
        font-family: "Segoe UI", sans-serif;
        padding: 20px;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid #1f2937;
        padding-bottom: 10px;
      }
      h2 {
        font-size: 14px;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
        font-style: italic;
      }

      .mode-switcher {
        display: flex;
        background: #111;
        border-radius: 8px;
        padding: 4px;
        margin-bottom: 15px;
      }
      .mode-btn {
        flex: 1;
        padding: 8px;
        border: none;
        background: transparent;
        color: #6b7280;
        font-size: 10px;
        font-weight: 900;
        cursor: pointer;
        border-radius: 6px;
        text-transform: uppercase;
        transition: 0.3s;
      }
      .mode-btn.active {
        background: #6366f1;
        color: white;
        shadow: 0 0 10px rgba(99, 102, 241, 0.4);
      }

      .input-group {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 9px;
        font-weight: 900;
        color: #4b5563;
        text-transform: uppercase;
        margin-bottom: 5px;
      }

      input,
      textarea {
        width: 100%;
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 8px;
        color: white;
        padding: 10px;
        box-sizing: border-box;
        font-size: 12px;
        outline: none;
      }
      input:focus {
        border-color: #6366f1;
      }

      .file-box {
        border: 2px dashed #333;
        padding: 20px;
        text-align: center;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
      }
      .file-box:hover {
        border-color: #6366f1;
        background: #6366f105;
      }
      #fileLabel {
        font-size: 11px;
        color: #9ca3af;
        word-break: break-all;
      }

      button#saveBtn {
        width: 100%;
        background: #6366f1;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 900;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 10px;
      }
      button#saveBtn:hover {
        background: #4f46e5;
        transform: translateY(-1px);
      }
      button#saveBtn:disabled {
        background: #1f2937;
        color: #4b5563;
        cursor: not-allowed;
      }

      #status {
        font-size: 10px;
        text-align: center;
        margin-top: 12px;
        font-weight: bold;
        min-height: 15px;
      }
      .success {
        color: #10b981;
      }
      .error {
        color: #ef4444;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div
        style="
          width: 10px;
          height: 10px;
          background: #6366f1;
          border-radius: 2px;
        "
      ></div>
      <h2>NeuroVault <span style="color: #6366f1">Sync</span></h2>
    </div>

    <div class="mode-switcher">
      <button id="urlMode" class="mode-btn active">Link</button>
      <button id="fileMode" class="mode-btn">File</button>
    </div>

    <div id="urlSection">
      <div class="input-group">
        <label>Live Tab</label>
        <input type="text" id="displayUrl" disabled />
      </div>
    </div>

    <div id="fileSection" class="hidden">
      <div class="input-group">
        <label>Attachment (PDF/IMG)</label>
        <div class="file-box" id="dropZone">
          <span id="fileLabel">Click to select asset</span>
          <input
            type="file"
            id="fileInput"
            class="hidden"
            accept="image/*,.pdf"
          />
        </div>
      </div>
    </div>

    <div class="input-group">
      <label>Vault Sector</label>
      <input type="text" id="collection" placeholder="General" />
    </div>

    <div class="input-group">
      <label>Note</label>
      <textarea
        id="note"
        rows="2"
        placeholder="Quick synaptic note..."
      ></textarea>
    </div>

    <button id="saveBtn">Commit to Vault</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
